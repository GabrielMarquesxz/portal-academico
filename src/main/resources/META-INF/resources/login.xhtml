<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html" lang="pt-BR">
<h:head>
    <title>Portal Acadêmico | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <h:outputStylesheet library="css" name="estilo.css" />
</h:head>
<h:body>
    <main class="page login-page">
        <section class="card login-card">
            <p class="eyebrow">PORTAL ACADÊMICO</p>
            <h1>Entrar</h1>
            <p class="muted">Consulte suas aulas, horários e salas.</p>
            <h:form id="loginForm">
                <h:messages globalOnly="true" styleClass="alert" />
                <h:outputLabel for="login" value="Usuário" />
                <h:inputText id="login" value="#{loginBean.login}" required="true"
                             requiredMessage="Informe o usuário." styleClass="input" />
                <h:message for="login" styleClass="field-error" />
                <h:outputLabel for="senha" value="Senha" />
                <h:inputSecret id="senha" value="#{loginBean.senha}" required="true"
                               requiredMessage="Informe a senha." styleClass="input" />
                <h:message for="senha" styleClass="field-error" />
                <h:commandButton value="Entrar" action="#{loginBean.entrar}" styleClass="button" />
            </h:form>
            <p class="hint">Acesso demonstrativo para alunos e professores.</p>
        </section>
    </main>
</h:body>
</html>
