# Funciona localmente e no Render. Para conexoes remotas, configure DB_JDBC_URL
# com o host e os parametros SSL/TLS fornecidos pelo provedor do banco.
spring.datasource.url=${DB_JDBC_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:portal_academico}?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool menor para instancia Render Free e bancos remotos de desenvolvimento.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=0

joinfaces.faces-servlet.url-mappings=*.xhtml
# Render usa PORT; localmente continua sendo possivel usar SERVER_PORT.
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
