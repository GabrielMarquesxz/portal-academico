# Configuração segura: valores locais entram por variáveis de ambiente.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:portal_academico}?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# As páginas JSF são acessadas diretamente como /login.xhtml etc.
joinfaces.faces-servlet.url-mappings=*.xhtml
server.port=${SERVER_PORT:8080}
